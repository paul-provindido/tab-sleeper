<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tab Sleeper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">

    <header class="popup-header">
      <img src="icons/icon48.png" alt="" class="logo" aria-hidden="true">
      <h1 class="app-name">Tab Sleeper</h1>
    </header>

    <section class="stat-row">
      <span class="stat-label">Sleeping tabs</span>
      <span id="sleepingCount" class="stat-value">—</span>
    </section>

    <div class="action-row">
      <button id="sleepTabBtn" class="btn btn-primary">Sleep This Tab</button>
      <button id="sleepAllBtn" class="btn btn-ghost">Sleep Other Tabs</button>
    </div>

    <hr class="divider">

    <section class="setting-row">
      <label for="autoSleepToggle" class="setting-label">Auto-sleep</label>
      <label class="toggle-switch">
        <input type="checkbox" id="autoSleepToggle">
        <span class="slider"></span>
      </label>
    </section>

    <section class="setting-row" id="timeoutRow">
      <label for="timeoutInput" class="setting-label">Sleep after (minutes)</label>
      <input
        type="number"
        id="timeoutInput"
        class="timeout-input"
        min="1"
        max="480"
        step="1"
      >
    </section>

    <p id="saveStatus" class="save-status" aria-live="polite"></p>

    <hr class="divider">

    <section class="exclusions-section">
      <p class="section-label">Excluded domains</p>
      <textarea
        id="exclusionTextarea"
        class="exclusion-textarea"
        rows="4"
        placeholder="One domain per line&#10;youtube.com&#10;app.example.com"
        spellcheck="false"
      ></textarea>
      <button id="saveExclusionsBtn" class="btn btn-primary exclusion-save-btn">Save</button>
    </section>

  </div>
  <script src="popup.js"></script>
</body>
</html>
